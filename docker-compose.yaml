services:
  celery:
    build:
      context: ./celery/.
      dockerfile: Dockerfile
    container_name: celery
    command:
      [
        "celery",
        "-A",
        "app.main",
        "worker",
        "--loglevel=INFO",
        "--logfile=/logs/worker.log",
      ]
    volumes:
      - ./logs:/logs
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - reporting
    healthcheck:
      test: ["CMD", "celery", "-A", "app.main", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  flower:
    image: mher/flower
    container_name: flower
    env_file: .env
    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_URL}:5672//
    ports:
      - "5556:5555"
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - reporting

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # RabbitMQ
      - "15672:15672" # Management interface
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    # networks:
    #   - reporting

  
